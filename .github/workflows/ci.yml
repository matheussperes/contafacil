name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Qualidade do código de aplicação: type, lint, testes unitários, build.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # build não faz requisições; client Supabase é preguiçoso.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Banco: aplica migrations + seed e roda a suíte SQL num Postgres real.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar shim + migrations + seed + testes
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create database contafacil_test;"
          for f in supabase/tests/auth-shim.sql \
                   supabase/migrations/*.sql \
                   supabase/seed.sql \
                   supabase/tests/database.test.sql; do
            echo "==> $f"
            psql -h localhost -U postgres -d contafacil_test -v ON_ERROR_STOP=1 -f "$f"
          done
